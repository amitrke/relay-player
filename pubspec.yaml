name: relay_player
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
#
# This is the version being tested, and the release workflow reads it
# (docs/RELEASING.md, "Test builds and releases"). Every push to develop ships
# a build named after it to Play internal testing and TestFlight, e.g.
# "1.0.4 (12)". The build number after the + is ignored; CI uses its run
# number. The v1.0.4 tag, when it comes, must match this line.
#
# Bump it right after tagging a release. Until you do, the workflow refuses to
# ship more test builds under a version that has already been released.
#
# It was a deliberate 0.0.0 until 2026-09-23, when the tag was the only way to
# ship and this line was only a fallback; that reasoning is kept, marked
# superseded, in RELEASING.md.
version: 1.0.4+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  dio: ^5.11.1
  xml: ^7.0.1
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.6
  dart_plex: ^0.1.2
  smb_connect: ^0.0.9
  shelf: ^1.4.2
  go_router: ^18.0.1
  flutter_secure_storage: ^11.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  photo_manager: ^3.12.0
  saf_util: ^3.1.0
  saf_stream: ^4.0.1
  package_info_plus: ^10.2.1
  audio_session: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icons, generated by `dart run flutter_launcher_icons`.
#
# The vector sources in assets/icon/*.svg are the thing to edit; the PNGs beside
# them are 1024x1024 exports of those, and exist only because this tool reads
# raster input. Re-export the PNGs after changing an SVG, then re-run the tool —
# the generated sets under android/ and ios/ are committed output, not sources.
flutter_launcher_icons:
  # Android uses the adaptive pair, not the flat icon: a single square image
  # gets letterboxed inside whatever mask the launcher applies.
  android: true
  adaptive_icon_foreground: assets/icon/relay_icon_foreground.png
  # The foreground's play mark is white, so the background has to be the dark
  # ground from the full icon rather than the tool's default white.
  adaptive_icon_background: "#14121C"
  # Android 13+ themed icons: the system tints this single layer to match the
  # user's wallpaper, so it has to be a flat white silhouette.
  adaptive_icon_monochrome: assets/icon/relay_icon_monochrome.png
  # The tool insets the foreground by 16% by default, on the assumption the
  # source fills its canvas. These sources don't: the arc's outer edge already
  # lands at ~334/1024 from centre, just inside the 341px a circular mask
  # leaves visible. Insetting again would shrink the mark to two thirds of the
  # circle, so it stays at the size it was drawn for.
  adaptive_icon_foreground_inset: 0
  # Pre-adaptive launchers (API < 26) fall back to this.
  image_path_android: assets/icon/relay_icon.png

  ios: true
  # The App Store rejects icons with an alpha channel. relay_icon.png is already
  # fully opaque, so this is a guard rather than a fix.
  remove_alpha_ios: true
  image_path_ios: assets/icon/relay_icon.png

  windows:
    generate: true
    image_path: assets/icon/relay_icon.png
    # 256 is the largest size the .ico format carries.
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Licence texts for the native libraries media_kit bundles on Android,
  # registered with Flutter's licence page by lib/core/native_licenses.dart.
  # Fetched verbatim from upstream at the pinned versions; do not edit them.
  assets:
    - assets/licenses/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
