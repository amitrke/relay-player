name: Release to testers

# Builds a signed App Bundle and pushes it to the Play Console internal testing
# track, and a signed IPA to TestFlight. Setup — the upload key, the service
# account, the App Store Connect API key, and the one manual upload each store
# insists on first — is in docs/RELEASING.md.
#
# One workflow for both stores, not one each, so that one tag ships both and
# github.run_number is the build number on both: Play's versionCode and iOS's
# CFBundleVersion stay the same number for the same commit. Renamed from
# "Release to Play internal testing" when iOS joined (2026-09-23). Renaming is
# safe, but renaming or recreating the *file* would restart run_number, which
# both stores would reject until it passed their highest build.
#
# Separate from build.yml rather than a job inside it: that workflow makes
# debug-signed sideload artifacts and needs no secrets, so it can run on any
# branch without anyone holding the upload key. This one is the only place the
# key and the Play credentials are exposed to.
on:
  workflow_dispatch:
    inputs:
      status:
        description: >-
          Release status. "completed" rolls out to internal testers at once;
          "draft" leaves it in Play Console to roll out by hand. Play refuses
          anything but draft while the app itself is still a draft
          (see docs/RELEASING.md).
        type: choice
        options: [completed, draft]
        default: completed
  # A version tag is a deliberate "testers should get this" signal. Pushes to
  # main are not: release builds take ~6 minutes and most merges are not worth
  # a tester's update prompt.
  push:
    tags: ['v*']

concurrency:
  # Unlike build.yml, never cancel. A run killed mid-upload leaves an open Play
  # edit behind, and two uploads racing each other is the case Play rejects
  # most confusingly; queueing costs nothing but a wait.
  #
  # One group for both jobs: they run in parallel within a run, but a second
  # run waits for the first rather than racing it to either store.
  group: release
  cancel-in-progress: false

env:
  # Kept in step with build.yml; see the comment there.
  FLUTTER_VERSION: '3.47.0'
  PACKAGE_NAME: com.subnext.relay

jobs:
  check:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  bundle:
    name: Build and upload AAB
    needs: check
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in an `if:` directly; their presence can.
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Written outside the checkout, so nothing a later step does to the
      # working tree can pick it up, and removed at the end regardless of how
      # the job went.
      - name: Install the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          # A repository variable, not a secret: the alias is not sensitive,
          # and GitHub masks every occurrence of a secret's value in the logs.
          # With the alias as the word "upload", every log line mentioning an
          # upload came out as "***" (run 1, 2026-09-13).
          KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: its secret, or for KEY_ALIAS the repository variable, is not set. See docs/RELEASING.md."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # versionCode must strictly increase with every upload Play accepts, and
      # the run number of this workflow does. Two consequences worth knowing:
      # re-running a failed run reuses its number, so a run that got as far as
      # uploading cannot simply be re-run; and renaming or recreating this file
      # restarts the count at 1, which Play will reject until it passes the
      # highest code already uploaded.
      #
      # versionName comes from the tag when there is one (v1.2.3 -> 1.2.3) and
      # from pubspec.yaml otherwise.
      - name: Work out the version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
            if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not of the form v1.2.3"
              exit 1
            fi
            echo "name_arg=--build-name=$name" >> "$GITHUB_OUTPUT"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          # Play names a release after its versionName unless told otherwise,
          # so every untagged run arrived as another "1.0.0" and testers could
          # not tell builds apart (runs 1 and 2, 2026-09-13).
          echo "release_name=$name (${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      # Play's "what's new" text, which until now was typed into Play Console
      # after every upload. Looked up before the build so a problem costs
      # seconds, not the six minutes a build takes.
      #
      # Two names are accepted, in the same folder. `<versionCode>.txt` is the
      # layout fastlane `supply` expects (#8), but the code is this run's
      # number, which nobody knows before pushing a tag. `<tag>.txt`
      # (`v1.0.2.txt`) can be written in advance; supply ignores that name, so
      # the two conventions do not collide.
      #
      # This is store listing copy, so architecture.md §8.2 applies to it as it
      # does to the description. A run with no notes still uploads, with a
      # warning: an untagged test build is allowed to say nothing.
      - name: Pick the release notes
        id: notes
        run: |
          dir=fastlane/metadata/android/en-US/changelogs
          candidates=("$dir/${{ steps.version.outputs.code }}.txt")
          if [ "${{ github.ref_type }}" = tag ]; then
            candidates+=("$dir/$GITHUB_REF_NAME.txt")
          fi
          for f in "${candidates[@]}"; do
            [ -f "$f" ] || continue
            # Characters, not bytes: Play's limit is 500 per language, and the
            # notes use typographic quotes and ellipses.
            length="$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().strip()))' "$f")"
            if [ "$length" -gt 500 ]; then
              echo "::error::$f is $length characters; Play accepts at most 500"
              exit 1
            fi
            out="$RUNNER_TEMP/whatsnew"
            mkdir -p "$out"
            cp "$f" "$out/whatsnew-en-US"
            echo "dir=$out" >> "$GITHUB_OUTPUT"
            echo "Release notes: $f ($length characters)"
            exit 0
          done
          echo "::warning::No release notes found (looked for ${candidates[*]}). Uploading without them; add them in Play Console if testers should see any."

      - run: >-
          flutter build appbundle --release
          --build-number=${{ steps.version.outputs.code }}
          ${{ steps.version.outputs.name_arg }}

      # build.gradle.kts falls back to the debug key when key.properties is
      # missing or unreadable, which keeps local release builds working and
      # would, without this, turn a broken secret into a bundle Play rejects
      # only after the upload — or, for the first manual upload, into a debug
      # certificate registered as the upload key.
      - name: Refuse a debug-signed bundle
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          # keytool reports an unsigned file as text rather than only through
          # its exit status, so check both.
          cert="$(keytool -printcert -jarfile "$aab" 2>&1)" || true
          if [ -z "$cert" ] || grep -q 'Not a signed jar file' <<< "$cert"; then
            echo "::error::$aab is not signed"; exit 1
          fi
          if grep -q 'CN=Android Debug' <<< "$cert"; then
            echo "::error::$aab is signed with the debug key"; exit 1
          fi
          # Fingerprint only: it is what Play Console shows for the upload key,
          # so a mismatch there can be diagnosed from this log.
          grep -E 'SHA256:' <<< "$cert"
          echo "versionCode ${{ steps.version.outputs.code }}, $(du -h "$aab" | cut -f1)"

      # Kept whether or not the upload runs. Play's API cannot create an app's
      # first release, so the very first bundle has to be downloaded from here
      # and uploaded in Play Console by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Play internal testing
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        # Pinned to the commit behind v1.1.5, not the tag. This step is handed
        # a service account key with release rights on the Play listing, and a
        # tag is something the action's owner can move.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.release_name }}
          # `tracks`, not `track`, which v1.1.5 reports as deprecated.
          tracks: internal
          status: ${{ inputs.status || 'completed' }}
          # Empty when no notes were found, which the action treats as unset.
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}

      - name: Note the skipped upload
        if: env.HAS_PLAY_CREDENTIALS != 'true'
        run: >-
          echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle
          was built and kept as an artifact but not uploaded. Expected before
          the first manual upload; see docs/RELEASING.md."

      - name: Remove the upload key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

  ios:
    name: Build and upload IPA
    needs: check
    # macOS runners are free for a public repository. This job is still the
    # slow one (~15 min, most of it the archive), so it runs beside the Android
    # job rather than after it, and a failure here does not hold Android back.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
      # Repository variables, not secrets, for the reason given for KEY_ALIAS
      # above: neither is sensitive on its own, and a secret's value is masked
      # wherever it appears in the log. The .p8 file is the secret.
      ASC_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # The runner image's default Xcode lags the newest one it carries, and
      # App Store Connect rejects uploads built against an SDK older than
      # Apple's current minimum. Pick the newest stable Xcode on the image.
      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Same rules as the Android job, with one difference: only a tag uploads.
      # An untagged Android run lands on the internal track as "0.0.0 (n)",
      # which is harmless there; on iOS it would open an App Store version
      # named 0.0.0 in App Store Connect, which stays in the version list. So an
      # untagged run stops after the signed archive — enough to show signing
      # still works — and uploads nothing.
      - name: Work out the version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
            if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not of the form v1.2.3"
              exit 1
            fi
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "iOS $name (${{ github.run_number }})"

      # Written outside the checkout, into the directory xcodebuild and altool
      # both search, and removed at the end however the job went.
      - name: Install the App Store Connect API key
        if: env.HAS_ASC_KEY == 'true'
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: its repository variable is not set. See docs/RELEASING.md."
              exit 1
            fi
          done
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Without the key there is no way to sign, so the run still proves the
      # iOS build compiles — the thing most likely to break unnoticed, since
      # nothing else in CI builds for iOS — and says why it stopped there.
      - name: Compile without signing
        if: env.HAS_ASC_KEY != 'true'
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.version.outputs.code }} \
            --build-name=${{ steps.version.outputs.name }}
          echo "::notice::APP_STORE_CONNECT_API_KEY_P8 is not set, so the iOS build was compiled but not signed or uploaded. See docs/RELEASING.md."

      # flutter build ipa cannot pass an API key to xcodebuild, and without one
      # a CI machine has no Apple account to sign with. So Flutter only
      # generates the Xcode configuration (--config-only), and xcodebuild does
      # the archive and export itself, with -allowProvisioningUpdates and the
      # key: that is what lets Apple's cloud-managed signing supply the
      # certificates and profiles, so no .p12 or profile has to live in
      # secrets. Cloud signing needs the key to have the Admin role.
      #
      # UNVERIFIED until the first tagged run. The same export path worked from
      # Organizer on 2026-09-23, but Organizer signed with the Xcode account on
      # a Mac, not with an API key on a clean runner. If signing fails here,
      # the fallback is the Android pattern: a distribution certificate and
      # profile in secrets (docs/RELEASING.md, failure modes).
      - name: Archive
        if: env.HAS_ASC_KEY == 'true'
        run: |
          flutter build ios --release --config-only \
            --build-number=${{ steps.version.outputs.code }} \
            --build-name=${{ steps.version.outputs.name }}
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40
          # tail hides xcodebuild's exit status; the archive's presence is the
          # check that matters.
          test -d "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' \
            "$RUNNER_TEMP/Runner.xcarchive/Info.plist"

      # ios/ExportOptions.plist sets destination=upload, so this step both
      # signs for distribution and sends the build. Its exit status is the
      # result: do not replace it with anything that reads the upload log.
      - name: Export and upload to TestFlight
        if: env.HAS_ASC_KEY == 'true' && steps.version.outputs.upload == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40

      - name: Note the skipped upload
        if: env.HAS_ASC_KEY == 'true' && steps.version.outputs.upload != 'true'
        run: >-
          echo "::notice::Not a tag, so the IPA was archived and signed but not
          uploaded: an untagged upload would create a 0.0.0 version in App Store
          Connect. Push a v1.2.3 tag to ship to TestFlight."

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
