name: Build

# Artifacts for testing on real hardware, which is the bottleneck this exists
# to remove: docs/MANUAL_TESTING.md lists a pile of things that can only be
# checked on a device, and building each one by hand is the reason they keep
# getting deferred.
# Manual only for now. Release builds of this take ~6 minutes for Android alone,
# and the artifacts are wanted at the point someone is about to test on a
# device, not on every push.
on:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight build irrelevant. Release builds here take
  # minutes, so not cancelling just queues work nobody wants.
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version this has actually been built and verified with, not
  # to "latest" -- otherwise an unrelated Flutter release becomes a surprise CI
  # failure on a day you were doing something else.
  FLUTTER_VERSION: '3.47.0'

jobs:
  check:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Split per ABI: the universal APK is 89.9 MB against 30.8 MB for arm64,
      # purely from carrying libmpv three times (PHASE0_FINDINGS.md Q5).
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # flutter_secure_storage_windows compiles a C++ plugin that includes
      # <atlstr.h>, so the build needs Visual Studio's C++ ATL component. The
      # hosted runner image does not ship it -- the first run of this workflow
      # failed here -- so install it rather than only reporting it. Locally the
      # same component had to be added by hand (PHASE0_FINDINGS.md, incidental
      # findings).
      - name: Ensure the VC ATL component is installed
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $root 'vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw 'vswhere reported no Visual Studio installation' }
          Write-Host "Visual Studio: $install"

          # atlmfc\include\atlstr.h appears under the MSVC toolset directory
          # only once the ATL component is present.
          function Find-Atl {
              Get-ChildItem (Join-Path $install 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { Join-Path $_.FullName 'atlmfc\include\atlstr.h' } |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1
          }

          $found = Find-Atl
          if (-not $found) {
              Write-Host 'atlstr.h not present; adding Microsoft.VisualStudio.Component.VC.ATL'
              # vs_installer returns immediately when launched directly, so wait
              # on it explicitly or the re-check races the install.
              $p = Start-Process -FilePath (Join-Path $root 'setup.exe') -Wait -PassThru -ArgumentList @(
                  'modify', '--installPath', $install,
                  '--add', 'Microsoft.VisualStudio.Component.VC.ATL',
                  '--quiet', '--norestart', '--nocache'
              )
              # 3010 is success-pending-reboot, which does not stop the headers
              # from being on disk and usable.
              if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
                  throw "Visual Studio installer failed with exit code $($p.ExitCode)"
              }
              $found = Find-Atl
          }

          if (-not $found) {
              throw 'atlstr.h still not found after installing the ATL component.'
          }
          Write-Host "ATL headers: $found"

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
